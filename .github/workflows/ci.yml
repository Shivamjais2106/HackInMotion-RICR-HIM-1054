name: CI — Lint & Format

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend: Ruff lint + format check
  # ──────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend / Ruff (lint + format)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kisansathi/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: pip install ruff==0.4.4

      - name: Ruff — lint check
        run: python -m ruff check .

      - name: Ruff — format check
        run: python -m ruff format --check .

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend: Prettier format check + ESLint
  # ──────────────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend / Prettier & ESLint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kisansathi/frontend/kisansathi-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kisansathi/frontend/kisansathi-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prettier — format check
        run: npm run format:check

      - name: ESLint — lint check
        run: npm run lint -- --max-warnings 200

  # ──────────────────────────────────────────────────────────────────────────
  # Frontend: Build check
  # ──────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend / Build
    runs-on: ubuntu-latest
    needs: frontend-lint

    defaults:
      run:
        working-directory: kisansathi/frontend/kisansathi-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kisansathi/frontend/kisansathi-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
