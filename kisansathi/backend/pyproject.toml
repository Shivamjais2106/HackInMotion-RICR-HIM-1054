[tool.ruff]
line-length = 120
exclude = [
    "__pycache__",
    ".git",
    "venv",
    "env",
    ".venv",
    "scripts/",
    "*.pyc",
]

[tool.ruff.lint]
# E — pycodestyle errors, F — pyflakes, W — pycodestyle warnings
select = ["E", "F", "W"]
ignore = ["E501", "E402", "W503", "F401", "F841"]

[tool.ruff.lint.per-file-ignores]
"app_enhanced.py"    = ["E402", "F401", "F841"]
"app_minimal.py"     = ["E402", "F401"]
"app_production.py"  = ["E402", "F401"]
"utils/*.py"         = ["E402", "F401"]
