[tool.ruff]
line-length = 120
exclude = [
    "__pycache__",
    ".git",
    "venv",
    "env",
    ".venv",
    "scripts/",
    "archive/",
    "*.pyc",
]

[tool.ruff.lint]
# E — pycodestyle errors, F — pyflakes, W — pycodestyle warnings
select = ["E", "F", "W"]
ignore = ["E501", "E402", "W503", "F401", "F841", "E731", "W291", "W293"]

[tool.ruff.lint.per-file-ignores]
"app_enhanced.py" = ["E402", "F401", "F841", "E711", "E722"]
"app.py"          = ["F401"]
"utils/*.py"      = ["E402", "F401"]
"test_*.py"       = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
