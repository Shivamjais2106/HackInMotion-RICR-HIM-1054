[flake8]
max-line-length = 120
exclude =
    __pycache__,
    .git,
    venv,
    env,
    .venv,
    *.pyc,
    migrations,
    scripts/
ignore =
    E501,
    W503,
    E203,
    F401
per-file-ignores =
    app_enhanced.py: E402, F401, F841
    app_minimal.py: E402, F401
    app_production.py: E402, F401
    utils/*.py: E402, F401
