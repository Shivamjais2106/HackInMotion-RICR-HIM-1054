# Ruff linter configuration — KisanSathi Python backend
# Run: python -m ruff check . --fix

line-length = 120
exclude = [
    "__pycache__",
    ".git",
    "venv",
    "env",
    ".venv",
    "scripts/",
    "archive/",
]

[lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "F401", "F841", "E731", "W291", "W293"]

[lint.per-file-ignores]
"app_enhanced.py"   = ["E402", "F401", "F841", "E711", "E722"]
"app.py"            = ["F401"]
"utils/*.py"        = ["E402", "F401"]
"test_*.py"         = ["F401", "F811"]
