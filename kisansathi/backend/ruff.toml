# Ruff linter configuration for KisanSathi Python backend
# Run: ruff check . --fix

line-length = 120
exclude = [
    "__pycache__",
    ".git",
    "venv",
    "env",
    ".venv",
    "scripts/",
]

[lint]
select = ["E", "F", "W"]
# W503 is a flake8-only code and makes ruff abort with "Unknown rule selector".
ignore = ["E501", "E402", "F401", "F841"]

[lint.per-file-ignores]
"app_enhanced.py"   = ["E402", "F401", "F841"]
"utils/*.py"        = ["E402", "F401"]
