version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=False
      - MONGODB_URI=${MONGODB_URI}
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEATHERAPI_KEY=${WEATHERAPI_KEY}
      - REDIS_ENABLED=False
    volumes:
      - ./backend:/app
    command: python app.py

  frontend:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/pixel-perfect-copy:/app
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 8080"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend
