[build]
  command = "npm ci && npm run build"
  publish = "dist"
  environment = { VITE_API_URL = "https://kisansathi-backend-hom2.onrender.com" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
